# Keeps the profile README current by pulling in blog posts and coding stats.

name: Update README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-blog-posts:
    name: Update Blog Posts
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # https://github.com/gautamkrishnar/blog-post-workflow
      # Reads the RSS feed and replaces the BLOG-POST-LIST markers in README.md.
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://yrizos.com/feed.xml"
          commit_message: "docs: update blog post list in README"
          max_post_count: 4
          retry_count: 2
          retry_wait_time: 3
          template: "- [$title]($url), $date$newline"
          tag_post_pre_newline: true
          date_format: "mmm dd yyyy"

  update-wakatime:
    name: Update WakaTime Stats
    needs: update-blog-posts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # https://github.com/athul/waka-readme
      # Reads WakaTime API data and replaces the waka markers in README.md.
      - uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9 # master
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          STOP_AT_OTHER: true
          # waka-readme prints "Other" before honoring STOP_AT_OTHER; ignore it explicitly.
          IGNORED_LANGUAGES: HTML CSS TOML JSON Binary Other
          COMMIT_MESSAGE: "docs: update WakaTime stats in README"
      # Checks out the branch head so the commit from waka-readme is included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      # Replaces the MARKDOWN-QUIP markers in README.md based on whether Markdown is in the WakaTime stats.
      - name: Pick the quip
        run: |
          python3 - <<'EOF'
          import re
          with open("README.md") as f:
              readme = f.read()
          waka = re.search(r"<!--START_SECTION:waka-->(.*?)<!--END_SECTION:waka-->", readme, re.S).group(1)
          if re.search(r"^Markdown\s", waka, re.M):
              quip = "I guess we are all Markdown engineers these days."
          else:
              quip = "A week free of Markdown is a good week."
          readme = re.sub(
              r"(<!-- MARKDOWN-QUIP:START -->\n).*?(\n<!-- MARKDOWN-QUIP:END -->)",
              lambda m: m.group(1) + quip + m.group(2),
              readme,
              flags=re.S,
          )
          with open("README.md", "w") as f:
              f.write(readme)
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "docs: update markdown quip in README"
          git push
